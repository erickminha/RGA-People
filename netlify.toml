[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  SECRETS_SCAN_ENABLED = "false"

# ============================================================
# ATENÇÃO: As variáveis secretas (SUPABASE_SERVICE_ROLE_KEY,
# RESEND_API_KEY, CLOUDFLARE_TURNSTILE_SECRET_KEY) devem ser
# configuradas no painel do Netlify em:
# Site Settings → Environment Variables
# NÃO adicione segredos aqui pois este arquivo é versionado.
# ============================================================

[[plugins]]
  package = "@netlify/plugin-nextjs"
